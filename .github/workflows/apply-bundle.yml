# 上传 site-bundle.tar.gz 到仓库根目录后，自动解包并替换仓库里的文档内容（.github 目录除外）。
name: Apply site bundle

on:
  push:
    paths: ['site-bundle.tar.gz']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bundle
        run: |
          set -e
          test -f site-bundle.tar.gz
          mkdir -p /tmp/bundle
          tar -xzf site-bundle.tar.gz -C /tmp/bundle
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/bundle/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update docs from site bundle" || echo "No changes"
          git push
